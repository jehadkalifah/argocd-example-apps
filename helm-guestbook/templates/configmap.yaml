apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  annotations:
    argocd.argoproj.io/sync-wave: "10"
data:
  APP_ENV: "development"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  # Configuration file example
  app.properties: |
    database.host: postgres.default.svc.cluster.local
    database.port: "5432"
    logging.enabled: "true"
